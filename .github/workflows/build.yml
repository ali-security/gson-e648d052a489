name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify -Dtest="${{ inputs.test-filter }}" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: Report skipped tests
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          total = 0
          for f in sorted(glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True)):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  sk = tc.find('skipped')
                  if sk is not None:
                      total += 1
                      reason = (sk.get('message') or '').strip() or 'no message'
                      kind = sk.get('type') or 'skipped'
                      print(f"SKIPPED {tc.get('classname')}#{tc.get('name')}: {kind}: {reason}")
          print(f"Skipped tests total: {total}")
          EOF
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: gson/target/gson-2.9.0.jar
          if-no-files-found: error
